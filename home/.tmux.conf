#################################
# True Color + Terminal
#################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

#################################
# Speed (huge feel improvement)
#################################

set -sg escape-time 0

#################################
# Mouse (makes tmux feel modern)
#################################

set -g mouse on

#################################
# Scrollback (you WILL want this)
#################################

set -g history-limit 100000

#################################
# Splits that make sense
#################################

unbind '"'
unbind %

bind | split-window -h
bind - split-window -v

#################################
# Vim-style pane movement
#################################

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#################################
# Reload config instantly
#################################

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

#################################
# Make panes resize faster
#################################

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#################################
# Status bar — Catppuccin-ish
#################################

set -g status on
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#181825,fg=#cdd6f4"
set -g message-style "bg=#1e1e2e,fg=#cdd6f4"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-right "#[fg=#f9e2af] %Y-%m-%d #[fg=#a6e3a1] %H:%M "

